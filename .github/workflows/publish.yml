name: publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or SHA to publish (must already carry the intended pom version)'
        required: true
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Without this the job dies later at "gpg --batch --import" reading an empty
      # variable, which says nothing about the cause. Presence is tested via a length
      # check so no secret value is ever echoed, compared, or written to the log.
      # OX Agent: Sensitive Data Protection prevented — secrets stay in the secret store,
      # only their presence is tested, never their value.
      - name: Check publishing credentials are configured
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          missing=""
          for name in CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD GPG_PRIVATE_KEY; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "(GPG_PASSPHRASE is deliberately not required: a dedicated release key may be unprotected.)"
            echo "Set each with: gh secret set <NAME> --repo ${{ github.repository }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Releases 1.1.0 and 1.2.0 were published by hand because these were never configured," >> "$GITHUB_STEP_SUMMARY"
            echo "which is how main drifted behind Maven Central. Configure them so releases are reproducible." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All four publishing secrets are present."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      # The tag is only a label; the version that reaches Central comes from the pom.
      # When they disagree, v1.3.0 silently publishes 1.4.0 (or worse, republishes an
      # existing version), which is exactly the ambiguity that let this repo's main and
      # Maven Central diverge. Refuse rather than guess.
      # Runs on BOTH triggers. Gating this on github.ref made it skip on every
      # workflow_dispatch, because that sets github.ref to the branch holding the workflow
      # file (refs/heads/main) no matter which ref was checked out - so the guard was absent
      # from exactly the path used to re-drive a failed release. Read the ref that was
      # actually built instead.
      - name: Verify the ref's version claim matches the pom
        env:
          BUILT_REF: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          case "$BUILT_REF" in
            v[0-9]*)
              claimed="${BUILT_REF#v}"
              ;;
            *)
              # A SHA or branch name asserts no version, so there is nothing to contradict.
              echo "Ref '$BUILT_REF' makes no version claim; skipping the cross-check."
              echo "Publishing pom version $(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)."
              exit 0
              ;;
          esac
          pom_version=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "ref claims: $claimed   pom says: $pom_version"
          if [ "$pom_version" != "$claimed" ]; then
            echo "::error::Ref $BUILT_REF claims version $claimed but the pom is $pom_version. Publishing would ship $pom_version under a $BUILT_REF label."
            exit 1
          fi

      # A tag can point at any commit, including one that never went through a PR, so the
      # release build runs the suite itself rather than trusting build.yml to have covered it.
      - name: Build and test
        run: mvn -B verify

      - name: Import GPG key
        run: |
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
          echo "default-cache-ttl 7200" >> ~/.gnupg/gpg-agent.conf
          echo "max-cache-ttl 7200" >> ~/.gnupg/gpg-agent.conf
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      # Presence checks cannot tell a correct passphrase from a wrong one, and an
      # unprotected release key legitimately has none at all. So instead of asserting on
      # the secret, make the key produce a real signature: this fails in seconds with
      # "Bad passphrase" rather than part-way through a deploy.
      - name: Verify the signing key can sign
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          key_id=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          if [ -z "$key_id" ]; then
            echo "::error::No secret key was imported from GPG_PRIVATE_KEY."
            exit 1
          fi
          echo "signing key: $key_id"
          if ! echo verify | gpg --batch --yes --pinentry-mode loopback \
                 --passphrase "${GPG_PASSPHRASE}" --local-user "$key_id" --sign -o /dev/null; then
            echo "::error::The imported key could not sign. If it is passphrase-protected, GPG_PASSPHRASE is missing or wrong; if it is unprotected, leave GPG_PASSPHRASE empty."
            exit 1
          fi
          echo "Signing key works."

      - name: Publish to Maven Central
        run: mvn -B -Prelease deploy -Dmaven.test.skip=true
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # autoPublish is false in the release profile, so a green run means the deployment
      # is VALIDATED AND STAGED, not live. Someone still has to release it in the Central
      # portal. Said out loud here so a green check is not mistaken for "it is on Central".
      - name: Say what green actually means
        run: |
          {
            echo "### Staged, not yet live"
            echo ""
            echo "\`autoPublish\` is \`false\`, so this upload is validated and **staged**."
            echo "Release it at https://central.sonatype.com/publishing/deployments for it to appear on Maven Central."
            echo ""
            echo "Verify afterwards:"
            echo '```'
            echo "curl -s https://repo1.maven.org/maven2/io/github/gero-labs/nexus-java-client/maven-metadata.xml | grep '<latest>'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
